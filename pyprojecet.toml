[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylo-read-classifier"
version = "0.1.0"
description = "Functional and phylogenetic classification of metagenomic reads"
requires-python = ">=3.10"

[project.scripts]
phylo-read-classifier = "phylo_read_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]